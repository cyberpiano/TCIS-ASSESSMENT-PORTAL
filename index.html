<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Temple Christian International School | Results & Reports</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tcis: {
              navy: '#1a2b49',
              'navy-dark': '#0f1b2f',
              'navy-light': '#2c3e60',
              gold: '#c59b27',
              'gold-light': '#dfb746',
              'gold-bg': '#fdf8eb'
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome 6 Icons via CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase Compat SDK (v10.8.0) via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Top Decorative Header Bar -->
  <div class="w-full h-2 bg-gradient-to-r from-tcis-navy-dark via-tcis-gold to-tcis-navy"></div>

  <!-- Main Login Container -->
  <div class="flex-grow flex items-center justify-center p-4">
    <div class="max-w-md w-full">

      <!-- Login Card -->
      <div class="bg-white rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden">
        
        <!-- Header with School Identity -->
        <div class="bg-gradient-to-b from-tcis-navy to-tcis-navy-dark p-8 text-center text-white relative">
          <!-- School Logo / Crest -->
          <div class="w-24 h-24 sm:w-28 sm:h-28 mx-auto mb-3 rounded-2xl bg-white p-2 shadow-xl flex items-center justify-center">
            <img src="tcis-crest.png" alt="TCIS Crest" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='tcis-logo.png';" />
          </div>
          <h1 class="font-crest text-xl sm:text-2xl font-bold tracking-wide text-white">
            TEMPLE CHRISTIAN
          </h1>
          <h2 class="text-xs uppercase tracking-widest text-tcis-gold font-semibold mt-1">
            International School
          </h2>
          <p class="text-xs text-slate-300 mt-2 font-light">
            Student Results &amp; Terminal Report System
          </p>
        </div>

        <!-- Form Body -->
        <div class="p-8">
          <!-- Error Alert Banner -->
          <div id="loginErrorAlert" class="hidden mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm flex items-start space-x-3">
            <i class="fa-solid fa-triangle-exclamation text-rose-500 mt-0.5"></i>
            <span id="loginErrorMessage">Invalid credentials.</span>
          </div>

          <form id="loginForm" class="space-y-5">
            <!-- Email Field -->
            <div>
              <label for="loginEmail" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">
                Staff Email Address
              </label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                  <i class="fa-solid fa-envelope text-sm"></i>
                </span>
                <input type="email" id="loginEmail" required autofocus
                  placeholder="name@tcis.edu.gh"
                  class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-tcis-navy focus:bg-white transition" />
              </div>
            </div>

            <!-- Password Field with Show/Hide -->
            <div>
              <label for="loginPassword" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">
                Password
              </label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                  <i class="fa-solid fa-lock text-sm"></i>
                </span>
                <input type="password" id="loginPassword" required
                  placeholder="Enter your password"
                  class="w-full pl-10 pr-11 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-tcis-navy focus:bg-white transition" />
                <button type="button" id="togglePasswordBtn" 
                  class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
                  title="Toggle password visibility">
                  <i id="passwordToggleIcon" class="fa-solid fa-eye text-sm"></i>
                </button>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="loginSubmitBtn"
              class="w-full py-3 px-4 bg-tcis-navy hover:bg-tcis-navy-dark text-white text-sm font-semibold rounded-xl shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-tcis-navy transition flex items-center justify-center space-x-2">
              <span id="btnText">Sign In to Dashboard</span>
              <i id="btnIcon" class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
            </button>
          </form>

        </div>

        <!-- Footer Notice -->
        <div class="bg-slate-50 px-8 py-3.5 border-t border-slate-100 text-center text-xs text-slate-500">
          <i class="fa-solid fa-lock text-slate-400 mr-1"></i>
          Authorized personnel only. No public registration.
        </div>

      </div>

      <!-- School Tagline -->
      <div class="text-center mt-6 text-xs text-slate-500">
        Temple Christian International School &bull; Accra, Ghana<br>
        <span class="text-tcis-gold font-medium">Excellence, Integrity and Christian Leadership</span>
      </div>

    </div>
  </div>

  <!-- System Version Footer -->
  <footer class="w-full text-center py-3 text-xs text-slate-400">
    TCIS Results System v2.0 &bull; Secure Portal
  </footer>

  <!-- Application Logic Scripts -->
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Login Page Interactive Controller
    document.addEventListener("DOMContentLoaded", () => {
      // If already logged in, redirect to dashboard
      const existingUser = window.Auth.getCurrentUser();
      if (existingUser && existingUser.active) {
        window.location.href = "dashboard.html";
        return;
      }

      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("loginEmail");
      const passwordInput = document.getElementById("loginPassword");
      const submitBtn = document.getElementById("loginSubmitBtn");
      const btnText = document.getElementById("btnText");
      const btnIcon = document.getElementById("btnIcon");
      const togglePassBtn = document.getElementById("togglePasswordBtn");
      const passIcon = document.getElementById("passwordToggleIcon");
      const errorAlert = document.getElementById("loginErrorAlert");
      const errorMsg = document.getElementById("loginErrorMessage");

      // Password visibility toggle
      togglePassBtn.addEventListener("click", () => {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          passIcon.className = "fa-solid fa-eye-slash text-sm";
        } else {
          passwordInput.type = "password";
          passIcon.className = "fa-solid fa-eye text-sm";
        }
      });

      // Form Submit (Pure Live Firebase Auth)
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorAlert.classList.add("hidden");

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) return;

        // UI Loading State
        submitBtn.disabled = true;
        btnText.textContent = "Authenticating...";
        btnIcon.className = "fa-solid fa-spinner fa-spin text-sm";

        try {
          await window.Auth.login(email, password);
          // Redirect upon verified authentication
          window.location.href = "dashboard.html";
        } catch (err) {
          let message = err.message || "Authentication failed.";
          errorMsg.innerHTML = message;
          errorAlert.classList.remove("hidden");
          submitBtn.disabled = false;
          btnText.textContent = "Sign In to Dashboard";
          btnIcon.className = "fa-solid fa-arrow-right-to-bracket text-sm";
        }
      });
    });
  </script>
</body>
</html>
